    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 40px;
        }

        .search-box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px #eee;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .main-wrap {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 20px;
        }

        .site-list {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px #eee;
            padding: 15px;
            height: 600px;
            overflow-y: auto;
        }

        .site-item {
            padding: 10px 12px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }

        .site-item:hover,
        .site-item.active {
            background: #3498db;
            color: #fff;
        }

        .info-panel {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px #eee;
            padding: 20px;
        }

        .site-title {
            font-size: 22px;
            color: #2c3e50;
            margin-bottom: 15px;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }

        .score-box {
            display: flex;
            gap: 15px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .score-item {
            flex: 1;
            min-width: 120px;
            text-align: center;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .score-item div:first-child {
            font-size: 16px;
        }

        .score-num {
            font-size: 24px;
            color: #e67e22;
            font-weight: bold;
        }

        .tab-box {
            margin-top: 20px;
        }

        .tab-nav {
            display: flex;
            border-bottom: 1px solid #ddd;
            overflow-x: auto;
            /* 横向滚动 */
            white-space: nowrap;
            /* 文字不换行 */
        }

        .tab-nav span {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 18px;
        }

        .tab-nav span.active {
            color: #3498db;
            border-bottom: 2px solid #3498db;
        }

        .tab-content {
            padding: 15px;
        }

        .tab-item {
            display: none;
        }

        .tab-item.show {
            display: block;
        }

        .poi-list li {
            list-style: none;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 16px;
        }

        .level-star {
            color: #f39c12;
            font-size: 22px;
        }

        /* 手机端：只在小屏幕生效，不污染电脑 */
        @media (max-width: 768px) {

            /* 全局字体缩小，适应手机屏幕 */
            * {
                font-size: 13px !important;
            }

            /* 1. 左右两栏 → 上下单栏布局，解决挤压错乱 */
            .main-wrap {
                grid-template-columns: 1fr;
            }

            /* 2. 缩短站点列表高度，手机不占满屏幕 */
            .site-list {
                height: 280px;
            }

            /* 3. 缩小内容内边距，充分利用手机屏幕 */
            .info-panel {
                padding: 15px;
            }

            /* 4. 标题字体缩小 */
            h1 {
                font-size: 26px;
            }

            /* 5. 标签栏自适应，字体调小 */
            .tab-nav span {
                padding: 8px 12px;
                font-size: 16px;
            }

            /* 6. 图片强制自适应 */
            img {
                max-width: 100%;
                height: auto;
            }

            /* 7.线路按钮变小 */
            button {
                padding: 8px 14px !important;
                font-size: 14px !important;
            }
        }
    </style>
</head>

                shop: ["便民超市", "日用杂货"],
                scenic: ["乡村田园", "郊野绿地"],
                bus: ["55路", "68路", "91路"]
            }
        ]

        const siteList = document.getElementById('siteList');
        function renderList(data) {
            siteList.innerHTML = '';
            data.forEach((item, idx) => {
                let div = document.createElement('div');
                div.className = 'site-item';
                div.innerText = item.name;
                div.onclick = () => selectSite(idx, data);
                siteList.appendChild(div);
            });
        }
        renderList(metroData);

        function selectSite(index, data = metroData) {
            let d = data[index];
            document.getElementById('siteName').innerText = d.name;
            document.getElementById('levelStar').innerText = "便利度评级：" + d.star;
            document.getElementById('score1').innerText = d.score[0];
            document.getElementById('score2').innerText = d.score[1];
            document.getElementById('score3').innerText = d.score[2];
            document.getElementById('score4').innerText = d.score[3];
            document.getElementById('score5').innerText = d.score[4];

            fillPoi('poi1', d.hotel, d);
            fillPoi('poi2', d.food, d);
            fillPoi('poi3', d.shop, d);
            fillPoi('poi4', d.scenic, d);
            fillPoi('poi5', d.bus, d);

            document.querySelectorAll('.site-item').forEach((el, i) => {
                el.classList.toggle('active', i === index);
            });
        }

        function fillPoi(id, arr, station) {
            let ul = document.getElementById(id);
            ul.innerHTML = '';
            arr.forEach(item => {
                let li = document.createElement('li');
                li.innerText = "• " + item;
                li.style.color = "#0066cc";
                li.style.cursor = "pointer";

                // 点击跳转导航：起点=当前地铁站，终点=设施名
                li.onclick = function () {
                    let url = "https://amap.com/search?keywords="
                        + encodeURIComponent(station.name + " 到 " + item);
                    window.open(url, '_blank');
                };
                ul.appendChild(li);
            });
        }

        document.querySelectorAll('.tab-nav span').forEach(item => {
            item.onclick = function () {
                let tabId = this.dataset.tab;
                document.querySelectorAll('.tab-nav span').forEach(s => s.classList.remove('active'));
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('show'));
                this.classList.add('active');
                document.getElementById(tabId).classList.add('show');
            }
        });

        document.getElementById('searchInput').addEventListener('input', function () {
            let key = this.value.trim();
            let filter = metroData.filter(item => item.name.includes(key));
            renderList(filter);
        });

        // 线路筛选功能
        function showLine(lineName) {
            let filterData = metroData.filter(item => item.line === lineName);
            renderList(filterData);
            if (filterData.length > 0) {
                selectSite(0, filterData);
            }
        }

        // 显示全部站点
        function showAll() {
            renderList(metroData);
            selectSite(0);
        }

        selectSite(0);
        function setActive(num) {
            let btn1 = document.getElementById('btn1');
            let btn2 = document.getElementById('btn2');
            let btn3 = document.getElementById('btn3');
            let btnAll = document.getElementById('btnAll');

            // 重置所有按钮
            [btn1, btn2, btn3, btnAll].forEach(b => {
                b.style.transform = "translateY(0)";
                b.style.boxShadow = "";
                b.style.filter = "brightness(1)";
            });

            // 选中对应按钮
            if (num === 1) {
                btn1.style.transform = "translateY(3px)";
                btn1.style.boxShadow = "0 1px 0 #666";
                btn1.style.filter = "brightness(0.85)";
            } else if (num === 2) {
                btn2.style.transform = "translateY(3px)";
                btn2.style.boxShadow = "0 1px 0 #666";
                btn2.style.filter = "brightness(0.85)";
            } else if (num === 3) {
                btn3.style.transform = "translateY(3px)";
                btn3.style.boxShadow = "0 1px 0 #666";
                btn3.style.filter = "brightness(0.85)";
            } else if (num === 0) {
                btnAll.style.transform = "translateY(3px)";
                btnAll.style.boxShadow = "0 1px 0 #666";
                btnAll.style.filter = "brightness(0.85)";
            }
        }
    </script>
</body>

</html>
